modLoader="javafml"
loaderVersion="[4,)"
license="MIT"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''First-person Cinematic Interactions scenes for TerraFirmaCraft workstations.'''

[[mixins]]
config="cinteractions_tfc.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1.200,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cinematic"
type="required"
versionRange="${cinematic_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tfc"
type="required"
versionRange="${tfc_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tfchotornot"
type="optional"
versionRange="${hon_range}"
ordering="AFTER"
side="BOTH"
